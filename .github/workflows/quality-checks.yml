name: Quality checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: JavaScript syntax check
        run: node --check app.js
      - name: Source integrity checks
        run: python tests/check_project.py
      - name: Simulation regression tests
        run: node --test tests/model_regressions.cjs
      - name: Deterministic scenario validation
        run: node tests/scenario_validation.cjs
